[project]
name = "lightweight-dag"
version = "0.3.1"
description = "A lightweight Python library for defining and executing DAG workflows"
readme = "README.md"
authors = [
    { name = "Lorenzo Gardini", email = "l.gardo98@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=lightweight_dag",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["lightweight_dag"]
